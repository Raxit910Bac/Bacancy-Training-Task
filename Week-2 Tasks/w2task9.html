<!-- Task 9 - Retrieving and Displaying API Data(then…catch) -->

<!-- Create a program that makes an API call and displays all the retrieved data on a web page. Choose a public API (e.g., JSONPlaceholder, OpenWeatherMap) and use the fetch function to make the API request. Also implement error handling. -->


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Data</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
  </style>

</head>

<body>

  <h1>Fetch API Example</h1>
  <button id="fetchData">Fetch Data</button>
  <div id="data"></div>

  <script>
    document.getElementById("fetchData").addEventListener("click", fetchData);

    function fetchData() {
      const dataContainer = document.getElementById("data");

      fetch("https://jsonplaceholder.typicode.com/posts")
        .then(response => {
          if (!response.ok) {
            throw new Error(`Error: ${response.status} - ${response.statusText}`);
          }
          return response.json(); // Convert response to JSON
        })
        .then(data => {
          dataContainer.innerHTML = JSON.stringify(data); // Directly print JSON data
        })
        .catch(error => {
          dataContainer.innerHTML = `<p style="color: red;">Failed to fetch data: ${error.message}</p>`;
        });
    }
  </script>
</body>
</html>
