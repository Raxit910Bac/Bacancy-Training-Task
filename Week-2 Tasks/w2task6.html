<!-- Task 6 - setInterval Practical -->

<!-- Create a static website that contains a start and stop button. Upon clicking the start button, something should be printed every 1 second. Clicking the stop button should halt this process using setInterval. -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start - Stop Interval</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Start-Stop Interval Example</h1>
  <button id="startBtn">Start</button>
  <button id="stopBtn">Stop</button>
  <div id="output"></div>

  <script>
    let intervalId = null; // To store interval ID
    let count = 1;

    document.getElementById("startBtn").addEventListener("click", function () {
      if (!intervalId) { // Prevent multiple intervals
        intervalId = setInterval(() => {
          document.getElementById("output").innerHTML += `Printing ${count}<br>`;
          count++;
        }, 1000);
      }
    });

    document.getElementById("stopBtn").addEventListener("click", function () {
      clearInterval(intervalId);
      intervalId = null; // Reset intervalId
    });
  </script>

</body>

</html>
