<!-- Task 10 - Retrieving and Displaying API Data(async…await) -->

<!-- Create a program that makes an API call and displays all the retrieved data on a web page. Choose a public API (e.g., JSONPlaceholder, OpenWeatherMap) and use the fetch function to make the API request. Also implement error handling -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Fetch Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #data {
      margin-top: 20px;
    }

    .user {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>Fetch API Example</h1>
  <button id="fetchData">Fetch Users</button>
  <div id="data"></div>

  <script>
    document.getElementById("fetchData").addEventListener("click", fetchData);

    async function fetchData() {
      const dataContainer = document.getElementById("data");
      dataContainer.innerHTML = "Loading..."; // Show loading message

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        if (!response.ok) {
          throw new Error(`Error: ${response.status} - ${response.statusText}`);
        }

        const users = await response.json(); // Convert response to JSON
        dataContainer.innerHTML = ""; // Clear loading text

        // Display all users
        users.forEach(user => {
          const userElement = document.createElement("div");
          userElement.classList.add("user");
          userElement.innerHTML = `
                <h3>${user.name}</h3>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>City:</strong> ${user.address.city}</p>
                <p><strong>Company:</strong> ${user.company.name}</p>
            `;
          dataContainer.appendChild(userElement);
        });

      } catch (error) {
        dataContainer.innerHTML = `<p style="color: red;">Failed to fetch data: ${error.message}</p>`;
      }
    }

  </script>
</body>
</html>
